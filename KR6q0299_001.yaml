你運推移日南長至孟夏漸熱仲秋漸涼主丈子忍俊不禁出來道我則不然寒時向火熱即乘涼為復是世諦流布為復是佛法商量贏得莊周蝶夢長舉法昌遇和尚冬夜與感首座喫果子法昌拈起橘子云黃龍滋味何似者箇感云且待嘗過始得昌云驗人端的處下口便知音感云末代禪師多虗少實昌拈起托子云者箇又作麼生嘗感云須是和尚始得昌云一箇托子便不奈何師拈云停囚長智養病喪軀檢點將來誰之過歟當時見他拈起橘子只向他道內不足者急於人知待他拈起托子討什麼碗結夏小參一法若有毗盧墮在凡夫萬法若無普賢失其境界若一向把作無則墮空空大空勝義空有為空無為空畢竟空因有立無執空為有依無立有亦復如是殆不知幽靈絶待不有不無清淨本然遍周法界隨衆生心應所知量恁麼恁麼此義斯墮不恁麼不恁麼其義亦墮只如毗盧普賢作麼生折合湖州紙貴一狀領過舉以大圓覺為我伽藍身心安居平等性智師拈云時時具足日日團圝含元殿裏更問長安散夏小參鵝護雪蠟人氷盡是間家潑具一片畬一羅粟無非向外馳求喫粥喫飯過聽風聽雨眠但念水草餘無所知恁麼也不得不恁麼也不得恁麼不恁麼總不得以主丈畫一畫云散亂定隨流禪莫將安樂法容易與人傳舉溈山令侍者喚院主院主到溈山云我喚院主你來作什麼院主無對保寧代云將謂有何處分北澗即不然只向他道和尚且坐待為喚來教這老漢一生起不得除夜小參未得黃梅山裏信先開大庾嶺頭花如何種柏栽松手流入擔柴賣筊家今夕無可分歲豈無露地白牛不欲踏古人腳迹不如為梅兄説法所以古人道春風不世情委曲到山家隨分有春色一枝三兩花小小生涯隨家豐儉或若臨風千萬點背日兩三枝多多益辨未稱全提至於為有暗香來遙知不是雪依稀越國倣佛楊州瞥轉一機落落寞寞路不分夢中喚作梨花雲清清之水遊魚自迷若是玉堂金馬茅舍踈籬風月不到處花在不萠枝也大奇卓主丈云爛熳也想百花猶自未知舉龐居士問大梅久嚮大梅未審梅子熟也未師云到處生事大梅云你向什麼處下口師云引得春風入菜藍居士云百雜碎師云放過即不可大梅云還我核子來師云不索何獲居士便禮拜師云如何得一轉語啞却居士口良久云自非板築手鼎鼐少知音為無得和尚對靈小參大地及日月時至皆歸盡未嘗有一物不被無常吞二千年前黃面瞿曇雙林樹下夜半子時豈不是歸盡底時節正恁麼時無常吞耶吞無常耶若吞無常則怖死貪生慈悲何在自高用奇顯異惑衆為無常吞則三界獨尊四生共仰反不若三家村裏了事凡夫恁麼也不得不恁麼也不得恁麼不恁麼總不得到者裏識得黃面瞿曇敗缺處便見得新圓寂無得禪師昔本不生今本不滅五坐道場不曾動一絲毫許瀾翻千偈不曾有箇元字腳恁麼也得不恁麼也得恁麼不恁麼總得雖然如是要且未是他超宗越格處竪起拂子云要見無得和尚麼良久云劒去久矣復舉佛將入涅槃文殊請佛再轉法輪佛謂文殊云我四十九年未曾説一字汝請吾再轉法輪是吾曾轉法輪耶師頌云末上何曾轉法輪只今再轉謾勞神路行人不知天曉猶把靈符執夜明秉拂倒用橫拈眼似眉憨憨穩放一頭低全身輥入草窠裏東倒何妨復攂西回機轉位潑除自己家珍土面灰頭輥入者般群隊三世諸佛過者邊立六代祖師列在下風天下老和尚自領出去若是臨濟德山兒孫必然別有條章懸羊賣狗簸土揚塵處拈却中佛事風塵草動鵲噪鴉鳴時截斷圓通法門然雖如是在我靈隱門下只好香炊別甑濃點釅茶供養伊教伊三條椽下七赤單前熟歇去可中有箇眼頭生角囊裏盛錐忍俊不禁出來理問道秉拂上座事無一向某甲只得深深問訊叉手而立何故心不負人面無慚色舉大慧和尚在雲居圓悟會中作首座結夏秉拂次昭覺徹庵元和尚作禪客出云眉間挂劒時如何大慧云血濺梵天大似二龍爭珠長它智者威獰圓悟把住禪客云問也問得好答也答得奇只消者一問一答這川僧只解將死就地彈有甚共語處秉拂上座即不然待他道眉間挂劒時如何只對他道匙挑不上他若把住道只消這一問一答只向他道合取兩片皮何故江西紙貴散夏秉拂威音那畔儼爾目前缺減劫中何曾異此大唐國裏幸自風淳俗厚無端被他西土平白生這一重節目要令學者三月安居尅期取證擔雪填井於休夏日咨決心疑揑目生花引得此土無智比丘隨邪逐惡道畬得一片田種得一籮粟用盡自己心日中一食夜後一宿只恐不是玉如斯之輩若喚作煆了底金刁刀相似一向喚作門外遊人玉石俱喪兩途不涉如何辨明壓低萬象無圭角放出長松見老成舉嵒頭才跨德山門便問是凡是聖德山便喝嵒頭便禮拜洞山聞云若不是奯公也大難承當嵒頭云洞山老漢不識好惡我當時隻手擡隻手搦師拈云塗毒聲中喪命絶後再蘇真金百煉百精何曾變色隻手擡隻手搦毫𨤲有差天地懸隔告香普説告香乃藂林盛禮前輩未嘗盡行道大德備如慈明和尚尚且至再至三然後受南禪師告香況非慈明乎又安知我此衆中無南禪師者所以道我不敢輕於汝等汝等皆當作佛舜何人也豫何人也有為者亦若是彼既丈夫我亦爾不應自生而退屈灼然是如此豈可自暴自棄自信不及甘作凡夫從上廣大門庭將誰付托便可勇往直前以古人不到之地為小歇場心憤憤口悱悱寬作程限急著手腳忽然築著磕著便是絶後再蘇底時節尋常保任底揚在他方世界淨裸裸無一物可依倚若更遇人何患不透頂透底去然後土面灰頭入鄽垂手隨力隨量善應來機此段因緣不是小事所以前輩道須是生而知之者始有少分相應若是英靈底未出母胎時便作怪大慧和尚以趙州為生而知之者是何言歟我道一手指天一手指地自言天上天下唯吾獨尊已遲三刻了也學而知之困而學之討什麼碗困而不學驀地焦穀生芽石女生兒未是分外趙州見南泉值南泉偃息次泉問他近離甚處州云瑞像泉云還見瑞像麼州云不見瑞像只見臥如來雖則臨機專對要且聽事不真泉云你是有主沙彌無主沙彌州云有主沙彌師云早是不成器了也泉云如何是你主州云即日伏惟尊候萬福於是服勤左右信知十八歲上便解破家豈虗語哉且如南泉十八歲上解作活計何似他十八歲上解破家還緇素得出麼者箇便是仰山見中邑謝戒時時節子邑在繩床上坐見仰山來拍口云和和仰山從東邊立又從西邊立又從中心立謝戒了退身立師云將謂有多少奇特更得箇老把不定問道甚處得此三昧仰山云曹溪脫印子學得來師云善學柳下惠便好熱喝出去却去問他道曹溪用此三昧接什麼人仰云接一宿覺師云豈特鈍置曹溪和永嘉大師也陷在爛泥底引得他上門上戶道和尚甚處得此三昧邑又逐惡隨邪道馬大師處者新戒僧子果是難向道便接口與一拶道如何見性若是別箇定手腳忙亂賴值中邑也不行棒也不行喝也不竪拳竪指也不瞬目揚眉只向他道譬如一室內有六窗各有一獼猴東邊呌狌狌狌狌東邊噟西邊呌狌狌狌狌西邊噟如是六窗俱喚俱噟仰山禮拜起來曰所蒙和尚譬喻無不了知只如內獼猴睡外獼猴欲相見時如何這老漢通身是眼遂下繩床執仰山手作舞云狌狌與汝相見了也譬如焦螟蟲向蚊子眼睫上作窠向十字街頭大呌一聲云土曠人稀相逢者少雲居錫云中邑當時若不得仰山這一句語何處有中邑也師召大衆云仰山道什麼崇壽稠云還有人定當得此道理麼若定當不得只是箇弄精魂手腳佛性義在什麼處師云添得一箇玄覺云若不是仰山爭得見中邑什麼處是仰山見中邑處師云三生六十劫後來仰山偉見積翠老南直是具大信根信得積翠及如倚靠須彌山直是要就他一言之下打徹不肯小小了却然其為法之切不敢自欺凡見僧便禮拜云行偉老矣救取行偉寮中置一榻客至則讓榻叉手而立不措一語積翠謂之太絶物偉曰無常迅速何暇與人説雜話看他前輩甚生標致畢竟還他關西子打得徹頭徹尾且如老東山被遠録公水灑挺逐而不去衆人皆去盡遠令侍者看下間坐禪老川僧面上有數黑子者在否侍者曰只在彼坐禪遠喜曰他在足矣遂召至方丈與語奇之曰我老矣不能與汝説話近此有一後生長老名端我也不識他只見他頌臨濟三頓棒極是淨潔汝若信我説必了大事於是東山徑往見端沈潛衆中旦暮參求末後遂有山前一片間田地叉手丁寧問祖翁幾度賣來還自買為憐松竹引清風底時節須信宗師家不負人真實信得及也不負自己看他遠録公指南令他針水無疑何曾有一點生滅忌嫉身心來大率古人都無此身心又何曾見天下豪傑有生滅來有忌嫉來況佛祖乎他又不識白雲却令東山見他只是以法為親更無他事南北宗盛時二師各不相忌其徒各不相能自生荊棘豈不見內侍薛簡來曹溪問心要若非秀大師奏聖上安得聖上知有曹溪耶秀亦豈可輕議哉看他問降魔藏禪師曰此間無山精木怪汝為魔耶師云何者是佛藏云有佛便是魔師云何者是魔秀云汝若是魔必住不思議解脫境界師云己所不欲勿施於人藏云是佛亦無何境界之有師云慚愧慚愧報恩端居方丈八字打開興妖底一任興妖揑怪底一任揑怪然雖如是不是弄潮人莫入洪波裏法語真正為人初無言説不獲已垂一言半句施萬里鈎駐千里駒弗遇鵝王擇乳底眼腦未有不上他鈎線降此已還不言可知看他大梅見僧道馬大師佛法別也云非心非佛大梅斥之曰我但即心即佛老龐聞此則曰梅子熟也可謂鵝王擇乳若是楊歧種草自是驚人初非大驚小怪尋常淵默忽地雷聲擊石掣電作第二頭已是瞢底只今不是土曠人稀有語已來至今日初非四目八臂之異嘉定至今贋浮圖塞路非情即黨以欺金湯佛法者聯庸援謬布滿龍象所居所與居者一類狐腥狸臊不可向邇后生晚出有力氣者自作規矩若萬人敵未知鹿死誰手倘紛紛隨流腥臊漸染鮮不與厥類同陷罪固不在學者今尤甚也某人異於是故樂與語此啐地斷剝地折十有五雙坐在者裏有甚共語處況於諸方曲彔床邊丁字著腳堂堂開口接他野狐涎沫如油入麵如何出得若是眼頭生角三千里外識得此類更遠三千里急走過免此腥穢氣霑著却來碧雲山前淺淺水中沈三日晒三日了欵欵地向你道若論此事如墮千尺井心心念念只欲人救援井深人遠誰來救你縱有見者顰蹙喟嘆而去蓋他分上不著急須是自家自有方便出來始得所以祖師門下慈悲親切在大事你自枝當小事人不管處非惟觀世音我亦從中證某人求警䇿北澗為作是説試咬嚼看是井中語耶井外語行腳漢切忌為外事絆倒且那箇是外事參禪是外事學道是外事諸方口角取辦是外事之外事不知本分者何事也離鄉別井屋裏老幼似送喪樣哭謂汝必是嫌佛不做抱此志而出汝亦必有心先第一念欲何所務若是毒種便似迦陵頻伽在卵殼中目足明利其聲已壓衆鳥看來只有箇老川僧擔一擔紙故出來云千劫學佛威儀萬劫學佛相好南方魔子新來説教外別傳指心是佛吾往欲盡樓其種類而後已及乎被人吹滅紙燭直下垂涎妥尾一籌不獲盡其神力燒却紙故只道得箇窮諸玄辨若一毫置於大虗竭世樞機似一滴投於巨壑至今遂令川僧擡腳不起每與鄉曲兄弟舉此求為此老報東門之役土曠人稀相逢者少冀盡餘生尚復見之問古今不覺葛藤正因行腳漢𢬵得一生不會何事弗辦若是成群作隊口頭趁辦者邊咂噉些子甜那畔咀嚼些子味案頭聯麻頭續麻尾打萬戶死葛藤去諸方曲彔床邊吐出不才不淨被他相牽絆葛將去到一句不來便喚作無後手我且問你前手作麼生是故名為可憐愍者香嚴在大溈自謂古今一人而已洎遭溈山痛處錐劄道汝在百丈先師處問一答十問十答百我且問你父母未生前道一句來香嚴沈吟一上理會不得他這一道神呪便道我也不能參禪徑往忠國師庵基且作住菴活計一日擲瓦礫抵竹有聲忽鬼劈口道一擊忘所知方知不在多方百計作伎倆閉眉合眼舍父逃逝外打之繞搜求尋覔要會禪所以溈山泰與大慧祖説東山道趙州露刃劒一句便了大慧云一擊忘所知下文皆注腳某人請益舉此教看第一不得來問我我真箇是不會底長老頌古舉楞嚴經七處徵心卍庵頌七處徵心款便成推窮尋逐桉分明都緣家賊難防備撥亂乾坤見太平師頌云吹粳著米翻成特地不因一事不長一智舉阿難大衆獲本妙心卍庵頌東西南北捉虗空海角天涯信不通力盡神疲無處覔萬年松在祝融峰師頌云適我昔所願今者已滿足是玉也大奇只恐不是玉舉八還辨見卍庵頌明暗色空不可還不可還者絶躋攀夾截虗空成畔岸一重水隔一重山師頌云色空明暗各不相知行到水窮處坐看雲起時舉富樓那問佛清淨本然云何忽生山河大地卍庵頌清淨本然遍法界山河大地即皆現性覺必明認影明眼耳便隨聲色轉師頌云彌滿清淨終不容他山河大地萬象森羅舉六解一亡卍庵頌根塵縛脫本同源一處休復六用捐手把一條紅斷貫娘生鼻孔一時穿師頌云結解非殊存亡無據試問本來宗當初誰縛汝舉楞嚴會上觀世音菩薩三十二應身十四無畏法卍庵頌三十二應不思議十四無畏如流水男子身中入定時女子身中從定起師頌云翻手為雲覆手為雨業識忙忙無本可據舉妙性圓明離諸名相本來無有世界衆生卍庵頌一錢為本萬錢利富不足而貧有餘換骨奪胎些子藥輸它潘閬倒騎驢師頌云金盤不可動轆轆轉難住停待良久間圓明湛如露舉阿難大衆復白佛言若此妙明真淨妙心本來遍圓如是乃至大地草木蠕動含靈本元真如即是如來成佛真體佛體真實云何復有地獄餓鬼畜生卍庵頌雙劒峰前古寺基天尊元是一牟尼時難只得同香火莫聽間人説是非師頌云三蛇九鼠一畞之地干木隨身逢場作戲舉佛言阿難此等衆生不識本心受此輪回經無量劫不得真淨皆由隨順殺盜淫故反此三種又則出生無殺盜淫有名鬼倫無名天趣有無相傾起輪回性卍庵頌七處精研一妄心更隨三業殺盜淫身心不是用家具前箭猶輕後箭深師頌云客舍并州已十霜歸心日夜憶咸陽無端又渡桑乾水却望并州是故鄉舉如來自説禪魔後告阿難云無令心魔自起深孽卍庵頌瞿曇徹底老婆心見明色發理難任入鄉隨俗那伽定佛魔到此盡平沈師頌云挽弓須挽強用槍須用長射人先射馬擒賊先擒王舉應庵示衆云如世良馬見鞭影而行先佛照出衆云見鞭影者非良馬應庵休去師頌云疾焰過風第二頭不堪惆悵只堪愁一聲振𩮻長鳴後萬馬皆瘖一戰收舉僧問趙州萬法歸一一歸何處州云我在青州做一領布衫重七斤頌云當機覿面提覿面當機疾開眼放癡頑鞭逼人上壁舉香嚴去年貧頌云去年貧雷在天上壯今年貧水出山下蒙家風不與香嚴別尉斗煎茶銚不同舉丹霞訪龐居士頌云爺頑賴兒還債徹底老婆心赤土塗牛嬭舉丹霞訪國師頌云絶乳於菟弄瓜牙丹霞去後説丹霞棒頭有眼明如日須是南陽老作家舉德山隔江招手高亭橫趍隔江誰薦箭鋒機直下橫趍已是遲惆悵曲終人不見數峰削玉水瀰瀰舉圓覺經云居一切時不起妄念於諸妄心亦不息滅住妄想境不加了知於無了知不辨真實三春不是讀書天九春炎炎且放禪唯有秋冬較些子不如打睡過殘年舉僧問大隋劫火洞然大千俱壞才伸劫火光中問便解隨他去復回回到悔來坡下路亂山依舊碧崔嵬舉罽賓國王仗劒問獅子尊者云師得蘊空否者云已得蘊空離生死否者云已離生死可施我頭者云身非我有況於頭乎王遂斬尊者頭白乳高數丈王臂自墮劒下十分親難藏獨露身江流石不轉獨有蘊空名舉本庵和尚云諸方拈出半青黃總欠韋郎一夜霜爭似藥山今夜底滿盤托出自馨薌總欠韋郎一夜霜諸方拈出半青黃碧雲更不上盤釘舉似諸方笑一場舉僧問古德年窮歲盡時如何古德云東村王老夜燒錢東村王老夜燒錢不是年窮歲盡禪歲盡年窮消息別東村王老夜燒錢偈頌送濟東巖歸鄉一別嵒扄歲月深春風狼藉到如今回頭依舊嵓前路百鳥銜花無處尋送丙上人曾聽請數墨循行不療飢南來逴得者些兒從前伎倆人知有管取者些人不知送覺藏主歸華藏遁菴胸次太湖寬偃嶽旋嵐鼓不湍老手慣曾諳水脈也須觀水又觀瀾送明上人歸洞庭截流過了復隨流七十二峯橫點頭拶到無錐無卓處太湖空闊跨三州送正法悟無證得華嚴閣下朝旨歸百城煙水渺無涯一錫南來又北飛樓閣門開當日事只今毫髮不曾移示照上人照用同時詫合盤衲僧開眼受他謾何如日用常三昧萬象森羅對影寒示鑒上人長笑雲門顧鑒咦翻抽顧字土加泥從空擲劒雖無迹會見虗空有壞時獨庵四顧寥寥不自欺白雲流水自東西同途同轍人無數盡逐銜花百鳥迷放塘截斷衆流元止止踏翻一竅便滔滔休論未達其源底佛也不知來處高六解一亡六用無功信不通一時分付與春風篆煙一縷間清晝百鳥不來花自紅化鬮拈千手大悲像秋澄萬水家家月春入千林處處花為問大悲千手眼不知明月落誰家示僧二野逸師僧語帶訛早年成佛老成魔從頭至踵無靈骨奈爾瞻風撥草何相逢便要求禪鈔近日諸方偽鈔多慧日鈔書無兩樣只爭些子大誵訛漆匠求頌漆桶天然別休將好處修聽他百雜碎特地一場愁辨淨人奉辟支佛牙求度錯認緣生不自知退牙今屬辨沙彌若還祖辨有靈骨選得僧成莫學伊書圓正法語後三禪天上火星飛大地山河靡孑遺壞底話頭誰領解小留鐵脊鎮坤維頑極天童彌藏主計較思量未發機風塵草動百般疑四稜塌地羞前事爛了虗空也聽伊示如石上人直須辦得身如石一線開時石不如自解點頭須自肯待他人肯費分踈方上人上蔣山兼寄癡絶頑石闢初錯向諸方求郍堪同來打爺州只今又入鍾阜去從錯至錯無時瘳待欲商評者兩錯只有知非無肯諾癡叟頑翁舊同夢知我從來無鼻孔贊出山相脫屣金輪只等間六年癡坐碧孱顏出山不了些兒事何似當年莫入山常思惟大士十二瞪目諦觀時風絲萬緒風一聲潮雪響打入正思惟海霧斂山容開神珠在掌明鏡當臺普門無鎖鑰俗客不曾來聲成文謂之音作如是觀海底摸針空王至今悠悠我心趁隊選圓通無端立下風當時供死款錯説在聞中輪珠一百八數了從頭數念茲在茲不知其數自謂初於聞中驢年入流亡所補陀月龍眠筆筆有痕月無迹迹其迹普門寂寂迹既忘四達皇皇看月象聲亦觀色亦觀空劫后空劫前風動塵起山深水寒萬竅不風千波弗瀾天低月高山深水寒普門無路入終始不曾關從聞思修錯了路頭將錯就錯隨流入流補陀山鬼窟海月半輪秋從聞思修入三摩地動靜二相了然不生補陀小白花山上弗聽流鶯啼一聲籃盛魚不盛水弗自噇提入市稱子無星鈎頭有餌提魚籃像為散亂人現如是相方其定時孰為此像定亂一如此像亦無若言無像天地懸隔布袋六赤腳才穿市回頭便笑人手中果何物弄物不知名閉眼瞌睡開眼業識便恁麼去著甚死急背後曾開鬼眼睛雖然有眼又無筋問他覩史宮中事拈得乾魚舉似人笑破古音前回頭儘可憐只今無可笑仰面笑青天赤腳知晴躡屐知雨只這一著未敢相許魚乾拈起走長街道是天宮帶得來鐵奉化人頑似鐵阿師咍了更誰咍正續無名散聖無位秦漢不收慚愧慚愧天上無地下無只這無無已自塗胡區區更回首轉見費分疏問疾維摩賣弄瀾翻舌文殊是阿誰未曾談不二已自落思惟須菩提洗足已便趺坐突然道希有世尊你當時見箇什麼寒山寒山指出拾得執指不曾見月矮子看戲草衣文殊衣紉草髮如草未下五臺百怪俱兆手中經義不了我且問你前三三後三三是多少馬郎婦念得蓮經便嫁伊空花無蒂欲誰欺金沙灘上黃金鎖狼藉春風到幾時靈照女屋裏橫機抗老爺門前斂袂對丹霞爺生娘養好兒女有得許多無賴吒穿破衲針短線難穿間拈當負暄不須嫌破碎提起自完全了殘經從朝數黑豆數到黃昏後只見月如眉不覺靈犀透初祖五葉芬敷自一花無人圖蔓剪根牙不教著腳金陵地猶恨蕭梁未作家為癡絶和尚贊初祖達磨并馬大師畫象穿耳耳未嘗穴缺齒齒未嘗折北度一葦可航西歸隻履自挈或謂之空劫已前中流砥柱或謂之拈花已后金口木舌或曰正宗別調又曰直指曲説皆非吾之所謂道也若夫求大乘器走十萬里俟人作興器豈大乘夙負先覺禮聞來學學而知之既遠且邈負是四者吾恐五竺之鐵不足鑄此錯也金雞毒一粒粟未踏殺人已先跌足一十八灘兮障回死水八十四人兮淹浸弗死洪都兮泐潭宗風兮肆凌厲一波動兮萬波起派兮支兮滔滔者皆是更無一箇識玄旨只有歸宗較些子撿點將來玄沙道底普化風顛用盡到無餘一箇棺材八箇舁舁出鎮州城外去聽他木鐸自分踈趙州禪在口皮邊機攙石火先破家才十八更不使爺錢東南西北門開兩邊相見了也十萬八千臨濟白拈賊是這廝捋鬼頭巾假我服色胡蘆立地便要沈稱鎚落井不教沒脫間漏架天下第一自謂建立黃蘗宗旨不知黃蘗無處雪屈楊歧嵓雪巢索以三腳驢金剛圈栗棘蓬三物為犯禁云請慈明晚參對白雪大笑為父不慈為子不孝箇般駔𩦱行藏敢稱瞎驢種草爭怪人言不解禪尉斗煎茶不同銚為癡絶和尚贊三睡贊也喜罵也喜醒也睡困也睡善男子起法性如是東山棚八囉扎君子可八附子同鄉一樣辣餕餡嚼破一團鐵餡子一句未敢相許弗是沒人情箇中無肯路永明壽禪師客吟燈殘猿啼月落衲帔蒙頭千岩萬壑指破凡夫為等覺妙覺齊大小乘於錢索井索縱大辨於談笑寄虗懷於冥莫所謂百軸宗鏡之文如太山之一毫芒巍巍堂堂煒煒煌煌非心亦非佛破鏡不重光大慧師祖𮩸空雲帶補太虗縫祕以自傳公與衆共卷覆大千舌於洋嶼雲門不與摩竭同條袖擲大千手於梅州衡陽不與淨名同夢至於三藏十二部一切修多羅洎百家異氏之書雜然前陳無斷無滅有元有統瞥轉一機五峰斂眉伎倆盡也放下竹篦智者大師寶几在前如意在手禹背湯肩河目海口南嶽山中得聖師投針鉢水了無疑法華同聽真精進直到靈山未散時密庵正法眼曰破沙盆曰漏燈盞兩段不殊一倍相反鈍置雲黃山下老禪魔匙挑不上罪不重科但未知虗空消殞畢竟如何拙庵倚松看經象讀旁行倚松立義不精字不識海湧雲興追不及自贊二幼而不遜長而無述老而不死賊賊臨濟未是白拈自出洞來無敵字不識禪不會數米量柴料水打碓不是末后全提亦非現前三昧待衆生成佛盡衆生界空任從滄海變終不為君通題慈觀長老求贊監本倔強弗善勞謙不識拙庵他最不堪他亦人耳我亦人耳空自合空水自合水賣弄跨門一機至死無人發市父有重牙其子無齒沒齒穿齦如是如是小師求贊二平常心摩竭合砥柱不搖風雷不迅拈了也示祖敬無法商量一印印定不會道不會禪更求文墨掘地覔天別調宮商妙不傳小佛事侃侍者下火書經欲寫此經不識此經未去行腳已悔行腳時節既至回機轉位撩起便行不順人情侃侍者如救頭然莫負平生賢東堂下火賢耶愚耶誰敢輕擬生耶死耶聽渠瞥地四拈鈯斧住山只靠者一著子直饒死了燒了者箇依前不死煙盡處更添柴闍黎大似不曾齋鑑侍者下火出叢林入保社夢裏思家開眼作夜有時冷地思量却悔死在國師句下死眼活開寸然不挂三應國師則且置國師三喚意如何因風吹火用力不多升首座下火雪中鳳臺跨竈衝斷更無兩箇湖海馳聲走舉爭仰孤風杓頭舀出底如鳳如麟板首提撕時蓋天蓋地不露圭角是真丈夫者箇猶是升首座諸方共委底若是雪壓千山白牛無迹底消息未審誰人委悉不妨火焰説無生肯與春風話來歷如庵主入塔五朝天子太平僧不纏諸方死葛藤潭北湘南層落落長燃無縫塔中燈標監寺下火老標監寺出格風標比似別箇天地相遼年也高﨟也高都緣常住分上滴水滴凍自己分上甘受寂寥一匱緇田了無愧萬兩黃金也合消若是衲僧分上消他一滴水也大不容易亦非難亦非易衆眼難瞞金將火試容直歲下火我方入山容便出山無生一曲別調陽關北澗無德可戀南閩有路休攀某人荔枝莫羡江家緑直下翻身出火山明水頭下火百草頭祖師意明明道著明明不是鼎中湯井中水冷暖自知還知也未不是佛法商量亦非神通遊戲華胥夢斷曉鐘撞喚教洗面摸著鼻擊石火閃電光毋勞謙遜便請承當佛事千金璿寺主起龕意外無言壺中有天非祖師禪非如來禪常樂空間離衆憒閙非賢首教非天台教以是為公之教則三藏絶詮以是為公之禪則傳之無傳措諸身則出生入死如賈胡傳舍去留自若載諸行事則得之於心應之於手取之左右逢其原夢破百年倐如蛻蟬滔滔逝川所不為逝川俱東者未嘗變遷樂歸途其直如弦某人成佛雖居靈運後著鞭當在祖生先入塔一種住持六種成就繫心西鄉藏身北斗不負未生已前肯落長生懺後悠悠北之南寂寞可堪回首還他一點靈明八面玲瓏如晝落落生平為君細剖聽幢樹説借虗空口萬象點頭一塵不受車軸花如船耦一坐具地本來自有耳如何保任祖祖相承佛佛授手太平坦老秉炬鄉枌不足留三學海中遊一經不療饞此外吾何求瑞嵒呌得惺惺石頭裂一段風光俱漏泄半座承天獅子吼窟中狐狼野干皆膽折一器蚊蚋聲啾啾座上時復鳴鵂蜘蛛布網床角頭自謂羅龍打鳳到死不識羞拈得把茆來許浦正信善人皆景慕忽然坐脫立亡去無人不道可惜許可惜許不惜他禪道鑽天事業稽古只惜他始終把得定作得主不入青布衫隊伍不遭沈三道點污一著精明十分峭措野火自燒天脫却娘生袴興菴主秉炬興公庵主圓寂其徒致書來言曰先師住世七十一年受具三十餘夏襟懷灑落緇白同知不負出家之志化道一方而與之為善也又云雖不參禪亦不學教其所作為不敢自棄是所謂玄沙不出嶺保壽不度河不費一文錢風光都買盡又曰中年已後裝佛飯僧杜門却掃一意修行則雪峯所謂他非不用頻頻舉己過還應旋旋除者也末後又曰電影不停至誠念佛淨髮洗身泊然而逝則如經所言七日預知自知時至了了之時如入禪定可謂了生死之際矣此其一生結緣於屠太保廟中成就者如此然雖如是石霜道古廟裏香爐去又且如何話會直得三世諸佛説不得六代祖師提不起天下老和尚窺無門而我云何能知能説拈起火把云塞却耳根聽者箇説宣首座秉炬死向趙州行腳後生從黑豆未芽時出生入死無餘事畢竟無生又是誰要見無生底宣首座麼走遍天涯慧日投老以柔制剛用得恰好有時喜珊瑚樹林日杲杲有時怒托動三有大城變清涼為熱惱雨霽風收江澄月皎相將漏盡鍾殘却悔歸來不早雖不早也不遲拈將未了公案盡情付與闍維演監寺入塔演出一大藏滴水不漏演入一大藏一場漏逗覔箇元字腳子虗訪烏有也無頭也無手描不成畫不就世界壞時渠不朽某人多子塔前不須回首資上人入塔育王秀嵓會中時佛照居東庵貧無長物夙有靈骨大爐鞴中烹煉出來死灰堆裏藏他不得高揖釋迦不拜彌勒了無位次可安排翻身直下蒼龍窟覺維郍入塔掌綱維明賞罰毀禁制翻途轍生鐵脊梁入火不熱浩浩清風動寥沉泥牛觸破澄潭月顯上人入塔顯大人相如惡叉聚𪹼出死灰無本可據從頭收拾來盡底撥撒去擲地作金聲掀翻無影樹秀浴主入塔妙觸宣明惡水潑人成佛子住好人不做掀倒涅槃臺翻身恁麼去恁麼去絶疑猜蕭蕭黃葉落白露點蒼苔荊知客秉炬全主復全賓當機要驗人不拈柏對子生怕惡聲名且道與四面顯知容是同是別若道是同捕風若道是別捉月同則始終同別則始終別荊知客踏斷江西十八灘從教水底火燒天真西堂秉炬坐脫立亡背翻筋斗樓頭浪宕刺在泥中雖然兩段不同要且一門超出猶是我淨土真禪師尋常行履處若是轉位回機潛行密用不在然燈前不落空劫後春風亂舞堤邊柳試聽火中師子吼旦過二僧秉炬一人四明一人處州三江九堰家何在古栝三嵓夢已殘盡是舊時行履處却愁風雨渡江難風寒雨寒總不相干石火電光機用活大家携手出長安通大師入塔辨利寺中通大師辭親割愛去為尼半千大或從頭受未死之前儘受持讚佛效勝鬘夫人之供獻珠如娑竭龍女之機人生百歲七十者希雖然死了燒了猶有者箇星兒只這星兒佛眼難窺無縫塔中全體現翻身靠倒五須彌無極和尚挂真十虗澄曠不受塗糊萬象森羅難逃影質任是十成模寫還他六用精明某人平生恁麼豈非跨竈亦復衝樓一見東寺師叔於丹青閣前生涯都蕩盡三應南陽國師於冷泉亭上聾人爭得聞自此倒行逆施一向脫間漏架工夫妙密韜略精明擬效千歲和尚住山却笑八十趙州行腳天香瑞雪小試全提雲月溪山只得一半三分鼎足再世話頭話頭即不無且道文殊三處度夏與鼎分三足是同是別浩浩諸方倩誰甄別付與溪聲廣長舌挂真人心不同有如面焉面既不同心何以傳所不可傳則肝膽楚越其或可傳則古意在絃昧者反是必謂影可捕逐鏡生𡟎妍蠡中有海管中有天遠之遠矣又何啻十萬八千殆不知此老本來面目豈生死所能變遷亦非妙亦非玄雙雙無影樹看取未生前圭法公起骨冷笑知賓無眼腦平欺首座惹塵埃只今死了又燒了長嘯一聲歸去來安法公秉炬安法公常坎軻學得貧便做大不傳黃梅信衣故是作家便著普化直裰有何不可末後句是什麼一手提水一手放火園頭智守秉炬鏡破却須臺上挂偈成不用壁間書無禪無道無生死却笑衣盂付老盧智守再來翻火種還你護身符錢承事起材洪範所陳箕子五福不有善人其何能足一曰壽七十者稀君餘一紀萬事既足所欠者死二曰富赤手起家子孫詵詵乃積乃倉如岡如陵三曰康寧面不曾皺睡則合眼飯來開口四攸好德以賢為則先進野人如此標格五考終命晚而益徑生死到來如入禪定有一於此足以稱懷五者備矣豈不賢哉末後句弗安排一念西之花隨步開某人惟心真淨土無去亦無來秉炬此是勝熱婆羅門所受度處擬跨其門萬行悉具生以不生為生死以不死為死三從之戒婦道修舉三遷之教母儀昭著豈惟美播鄉閭抑亦光昭門戶清涼地大火聚一等家風不須却步且道以何為據以火把打圓相云以此為據陸氏撒骨此是于承事陸氏孺人夙有底靈骨先行不到末後大過虗幻身中同觀起滅真實地上斷不蹉跎供養如來遍賢劫三千剎海檢點日用依古人十二時歌讀誦大乘經典於中所得偏多苾芻藏密蘭玉婆娑滔滔逝水無可回之波八功德池無不盈之科尚餘者箇必竟如何不如歸去好淨土勝娑婆沈太君起材去年無恙時萬事足欠一死今夕復何夕何所欠復奚為美則美矣更看全提較他凌行婆孰先孰後喚作俞道婆誰是誰非不作月上女解恁麼去依稀散花天住毗耶離身後無遺恨生得寧馨兒兒憶其母如母憶兒決定見佛決不相疑遺得蓮花種子不染五濁淤泥直向九蓮池上占得攙先一枝從初發心姓名便題一朝歸去寸步不移舉頭殘照外元是住居西煆髮殿前剗草殿前燒草草中鎮海明珠火後靈光獨耀一箇不消得何須一栲栳明眼人前不直一笑澗陰語日本未行豫忝為耳孫責不歸焉耶古岩西堂募緣開版語録外集二册既印行京師豫集衆讀而夸之吾祖如此胸次也有似葛伯不能祀其成湯送餉於民使耕田為祀葛伯而食之繇是豫雖讀而夸之顙泚且如應安庚戌夏不遠孫拜手
