body:
  text: 北澗和尚初住台州般若禪院語録參學大觀編方丈趂鼠入角吹粳著米直下翻身劒去久矣法座信腳行信口道一步登高全身入草知心若解相扶好把禪床靠倒祝香此一瓣香恭為今上皇帝祝延聖壽無疆萬歲萬歲萬萬歲次拈香云此一瓣香奉為判府郎中合郡官僚常居祿位問答提綱不録上堂舉三聖興化二大士一人逢人則出出則不為人一人逢人則不出出則便為人師拈云未出草廬三分已定惜乎規模大小了般若出則出了也且道是為人不為人良久云臨時散瑞慶節升座法隨法行法幢隨處建立空所空寂空中現量涵容譬如金毛嚬呻入奮迅三昧情與無情從風而靡諸子傍睨各增勇健又如迦陵頻伽在殼氣宇英利已壓衆羽所以道未離兜率已生金輪萬乘之家未誕無憂已度塵沙無邊之衆法如是故豈假他求然晃晃然逈出思議之表也惟佛與佛乃知其真天人群生類皆承此恩力畢竟承誰恩力良久云一氣不言含有象萬靈何處謝無私上堂面門一思長時無間便與麼去討甚麼碗得路塞路看樓打樓攀緣四天下屋裏販楊州上堂無愧於心對聖僧不圖人愛愛人憎打刀不是并州鐵誰與諸方剪葛藤結夏上堂以大圓覺為我伽藍身心安居平等性智喫官酒臥官街當處死當處埋本來無位次何用強安排為施主升座著腳於初步之地如發機於千鈞之重其至爾力也然而不可不審忘心於頓證之地如破的於百步之外其中非爾力也然而不可不察審而察之則身心一如心外無餘至於百億法門百億名義涵攝密嚴超越玄祕在我衲僧門下須知別有一家風月橫拈倒用放去收來破二作三課無責有然雖如是要覔他一毫頭許了不可得且道衲僧有甚長處從來汗馬無人識只要重論蓋代功舉佛擊一髑髏問耆婆云此人生何處婆云生天又擊一髑髏云此人生何處婆云生人又擊一髑髏云此人生何處婆罔措師云耆婆善別音響如何第三度不知落處則前兩度未免誵訛敢問大衆今日某父子三人不生天人畢竟向甚處去聽取一頌七寶蓮花品字開一花一葉一樓臺水禽啼在深花裏花在水禽啼處開佛生日上堂還債金輪種陳年甘蔗苗九龍翻雪浪滴水也難消台州報恩光孝禪寺語録參學大觀編三門師子當門誰敢著仁義道中放過一著方丈節外生枝劣中取勝輟己為人無乃太甚還有不甘底麼喝一喝拈帖未離般若時擬作一契賣與報恩寺且不作貴不作賤如何商略顧大衆云官有明文人從私約拈衣黃梅七百如龍爭珠因甚今日劫在這裏爭之不足讓之有餘法座據此座者三奉詔旨五宿觀堂此話大行惡聲猶在還當得宗乘中事也無山僧今日要為伊雪屈去也祝香此一瓣香恭為今上皇帝祝延聖壽無疆萬歲萬歲萬萬歲次拈香云此一瓣香奉為判府寶謨郎中洎合郡官僚同資祿算又拈香云此一瓣香不直分文遼天索價別無奇特不肯雷同得於佛照老人依舊為渠拈出提綱問答不録從來不解強安排擲地金聲破草鞋無位真人無面目何妨運水及搬柴無心作佛有口噇空隨分住山且耕且戰不勞鞭影秧馬追風掣斷索頭泥牛吼月趂晴蓋屋乘時刈禾輸納王官更無餘事謳歌鼓腹共樂升平無端業風一鼓定業難逃巾子峯前無回避處不免劄箇硬寨直得鴉飛不度要使不入衆數底衲僧助桀為虐逐惡隨邪潑除正因凌蔑宗社然則先帝在天之靈又且如何崇奉將此深心奉塵剎是則名為報佛恩舉太宗皇帝問僧近離甚處僧云臥雲菴帝云臥雲深處不朝天因甚到此僧無對雪竇和尚代云難逃至化師頌云試問臥雲深處客不知何以答升平蕩然至化難逃避萬里堯天一點雲當晚小參問答不録靈龜曳尾拂迹迹生霧豹澤毛藏文文露避喧求靜未有其方喧靜一如重重關鎖所以古人道今朝得到無心地猶被無心趂出山放一頭低入垂手東倒西攂轉位回機然雖如是畢竟無神通菩薩足迹如何尋覔良久云自是時人自遮護先生毫髮不相瞞舉雲居弘覺禪師將欲謝事寺主問云和尚去後何人繼席覺云堂中簡簡密受印記携道具徑歸方丈寺主以簡為揀欲請第二座簡遂下山山神號泣云還我和尚來於是寺主追至麥莊具禮請歸山神復云我和尚歸也師拈云衲僧家磊磊落落妙於天地之不知鬼神何自而知耶若據報恩見處便是神憎鬼嫌也未得一半謝維那上堂犍稚未鳴已前幸自可憐生十聲既終之後諸人分上未曾移易絲毫許末後一槌因甚不知落處卓主丈下座上堂南來北來是凡是聖逢齋喫飯遇夜噇眠喚作見成翻成特地報恩跛跛挈挈百醜千拙且恁麼過良久云龍蛇易辨衲子難瞞上堂枯木寒灰銅崖鐵壁春到無痕春歸無迹桃花紅李花白明眼人前一場狼藉上堂初於聞中入流忘所圓通路絶滿面塵埃洞門無鎖鑰俗客不曾來謝沖首座上堂普化兩度踢倒飯床睦州三回教壞禪子當時放過至今遂成不了公案報恩因甚又著箇般漢車必橫推理須曲斷上堂黃面瞿曇以難信之法一網打就因甚法華會上五百比丘拂袖下靈山報恩初無一法與人不妨易信使汝諸人進亦佳退亦佳不獨與瞿曇相為冰炭所謂三年無改於父之道可謂孝矣上堂古德道第一句下明得可與佛祖為師第二句下明得可與人天為師第三句下明得自救不了報恩道第一句下明得自救不了上堂學道如鑽火逢煙未可休直待金星現歸家始到頭報恩則不然學道如鑽火逢煙未可休直待金星現曹門取鄭州徽宗皇帝大忌上堂鼎湖龍去不知還遙想清都虎豹間欲借剛風朝紫闕九天閶闔正開關元宵上堂威音王已前箇箇稱王稱鄭餘波末流無所不至有法門名無盡燈明者皆明明終不盡卓主丈一下云路遠夜長休把火大家吹滅暗中行上堂奔流度刃疾焰過風報恩門下非第一義直饒過得此依然落第二二三子以我為隱乎吾無隱乎爾上堂雲巖二十年在藥山只明此事澄潭不許蒼龍蟠趙州除二時粥飯外不雜用心兔子何曾離得窟鑄成鐵硯欲磨穿還他萬里功名骨冬至上堂運推移日南長至應時納祜看樓打樓群陰消剝盡特地一場愁上堂恰才冬至過了十日看看臘月三十日便在眼前報恩不是預搔待癢且道汝等諸人臘月三十日又作麼生折合謝莊主上堂插鍬叉手驢前馬後栽田博飯徐六擔板開田説大義彼此相鈍置開得一片畬隨手種空花如斯作略儘可觀光若是移山塞海奪食驅耕須還我報恩門下始得且道報恩有甚長處喝一喝臘八上堂舉孝宗皇帝問佛照釋迦佛入山六年所成何事佛照對云將謂陛下忘却師頌云六年勤苦竟何如為問君王記得無直下雖知難抵諱到頭終不受塗糊上堂三到投子含元殿裏九上洞山更覔長安自從夜雪擁鰲山一度思量一度寒元宵上堂二千年前靈山會上青天白日釋迦老子平白地道我見燈明佛本光瑞如此啞相似尚如此何況真箇是上堂窮廝煎餓廝吵古岸風高玉壺春曉便恁麼去未免偏枯話墮了也蘇盧蘇盧浴佛上堂二千年前朱明屆八何物老嫗生此寧馨九龍翻水九河傾洗到驢年也只寧上堂結夏已十日水牯牛作麼生若道一回入草去驀鼻拽將來未免傷鋒犯手不然溪東不然溪西但念水草餘無所知人牛都不見正是月明時上堂教中道衲衣在空間假名阿練若誑惑世間人自謂行真道汝等諸人總被誑惑了也便好拽轉痛與一頓若無報恩今日失利上堂識得一萬事畢了事衲僧一字不識直饒恁麼未稱全提禹力不到處河聲流向西上堂今日中夏了也畢竟事作麼生當陽一機轉身一步左右逢原了無回互本等牧牛人何曾頭角露謝監收上堂千年父祖舊田疇萬寶垂成及早收無底鉢盂開口笑聖凡一等飽瑞慶節上堂天中天聖中聖贊不及述不盡四海九州一印印定卓主丈一下云重明以麗乎正開爐上堂今日開爐報恩隨例火筯香匙各有節制若待豆𪹼冷灰未免相鈍置識火色辨風旨曲突徙薪已落第二明因立菴至上堂若論此事如兩陳對圓旗鼓相望來如震霆去如迅電若一向繩之以孫吳大似紲韓盧而責獲跌宕繩墨信手方圓度外出奇勝中鬪劣或遇明眼人不滿一笑良久云從前汗馬無人識何必重論蓋代功上堂一大藏教總是魔説日可冷月可熱是假易除是真難滅雪中上堂亂山裹雪玉崔嵬萬行門庭八字開惆悵善財歸去後寥寥不見一人來臘八上堂驀拈主丈云若謂如來今日成道則為謗佛若謂如來非今日成道亦為謗佛二途不涉截斷葛藤遠山無限碧層層上堂舉馬祖與西堂百丈南泉玩月馬祖云正恁麼時如何西堂云正好供養百丈云正好修行南泉拂袖便行馬祖云經入藏禪歸海唯有普願獨超物外師云一等是弄箇冬瓜印子馬師較些子子細看來猶欠悟在報恩道禪歸海經入藏惟願南泉匙挑不上徽宗皇帝大忌上堂正法明王乃過去佛雖久滅度而常現前利生如塵如沙説法如雲如雨絶百非離四句畢竟是何章句顧視大衆云塞却耳根分明聽取上堂舉雪峯示衆盡大地是解脫門因甚把手拽不入師云雪峯恁麼道且道誰在門外湖州鐵觀音禪寺語録參學大觀編三門此是觀音入理之門華鯨吼月虗籟沈秋裂破玄關了隨流復入流方丈南來底下載北來底上載月白風清太湖無蓋提綱未有長行而不住恁麼也得未有長住而不行不恁麼也得欲益無所益欲為無所為恁麼不恁麼總得宜作舟航無久住此恁麼不恁麼總不得我又誰管你總得與總不得十年袖手爭席漁樵一日出山山靈勒駕直得前無新證退失故居作麼生折合去良久云倒把一枝無孔笛順風吹了逆風吹復舉僧問古德觀音菩薩手把數珠念什麼佛古德云念觀音菩薩僧云某甲不會古德云求人不如求己師拈云大小觀音元不識自己當晚小參舉白陽順和尚問應菴和尚不與萬法為侶是什麼人菴云赤膊上東司師拈云今夜有人恁麼問只向它道不與萬法為侶者謝知事頭首上堂若論此事如同舟遇風相應若左右手波波挈挈喍喍啀啀是我冤家一㨾乖上堂窮廝煎餓廝炒東家兒啼西家婦笑暗寫愁腸善説法要良哉觀世音郎當也不少元宵上堂曲吹徹鼓皮穿夜深人靜燈碗油乾一道神光萬境間上堂伶俐衲僧十成峭措箇裏守株那邊待兔昨夜文殊普賢起佛見法見貶向鐵圍王老師自領出去徑山四道舊至上堂一人宗通病在內一人説通病在外一人宗説俱通病在見聞一人觸事不會東倒西擂且道誰是不會底擲主丈下座上堂舉石林問龐居士有箇借問居士不惜言句否士云便請舉來林云元來惜言句士云者箇問訊不覺落他便宜林掩耳而去士云作家作家師拈云才生便剗不得一半失之東隅桑榆已晚只如居士道作家作家且道石林還甘否上堂舉真淨云莫將無事會無事困人心師云不圖打草大慧云往往中無事毒者却以此言為非師云只要蛇驚顧視大衆云非不非是不是無事困人心莫將無事會施主請升座舉盤山送喪次聞歌郎云紅輪決定沈西去未審魂靈往那方聞孝子哭哀哀聲當下悟去師頌云薤露凄涼亦可憐白楊丹旐去翩翩哀哀聲裏無消息打著南邊動北邊病起上堂病來病去無聊賴及至除根病轉多事久多變年老成魔看它此去又如何湖州西余大覺禪寺語録參學大觀編方丈隻手擡隻手搦毫釐有差天地懸隔拈疏餘二即非真惟此一事實以疏付僧云密在汝邊我説不密法座箇是村裏師子座未免輸機活變弄真象假即今誰是傍觀者提綱動若行雲行雲無心止猶谷神谷神不死動與止俱止與動合動止二相了然不生恁麼説話非惟向補陀巖下守株待兔又未免錯認端師子漁父詞作破陳子既非詞又非曲煙消日出不見人欵乃一聲山水緑復舉龐居士問馬大師不與萬法為侶者是什麼人大師云一口吸盡西江水即向汝道師頌云千山鳥迹絶萬里人蹤滅扁舟簑笠翁獨釣寒江雪上堂諸方説禪地藏種田西余門下又却不然飢來喫飯困來打眠不是知音者徒勞話歲寒上堂十四年四月一流水無情落花無迹一句了然超百億莫待當來問彌勒浴佛上堂汲井花水煮薔薇露清淨法身遭點污良久云活戾世界一年一度上堂三分光陰二早過向下文長靈臺一點不揩磨彼自無瘡貪生逐日區區去終日茫茫喚不回頭爭奈何那事無妨且道如何是那事良久云匙挑不上正旦上堂舊歲已陳元日初吉今日今時序品第一北澗聊與諸人向第二頭相見去也向下文長付在來日上堂三月十五落花飛絮業識茫茫無本可據把得定作得主伶俐衲僧不恁麼去上堂舉佛告普眼菩薩云頗有人能説幻術文字中種種幻相所住處否答云不也佛言普眼幻中幻相尚不可説何況普賢菩薩祕密身境界祕密語境界祕密意境界而入其中能入能見師頌云晃晃在心目昭昭居色塵莫將銀世界喚作假銀城元宵上堂我見燈明佛本光瑞如此至若山河大地明暗色空萬象森羅燈籠露柱皆發本光瑞是汝諸人因甚腳跟下黑漫漫地芙蓉和尚至上堂跛跛挈挈百醜千拙鬪諸方勝勝諸方劣然雖如是明眼人前直得亡鋒結舌有理難伸更嫌何處不分明上堂舉華嚴會諸大菩薩不見普賢佛令想念求之即見師頌云瞿曇幾箇舌頭衆會幾箇眼睛頭頭物物剎剎塵塵自瞞猶自可最苦是瞞人安吉州思溪圓覺禪寺語録參學大觀編佛殿是佛亦拜是魔亦拜大膽小心不妨忒煞方丈目前機摩竭令無法商量一印印定上堂舉保福問鵝湖望州亭烏石嶺相見則且置作麼生是僧堂前相見鵝湖驟步歸方丈保福便入僧堂師拈云二尊宿僧堂前儘有可觀者若是控弦發機齊發齊中則望州亭了更有烏石嶺在謝知事頭首上堂未跨門時已是泗州人看大聖及乎到來却是大聖看泗州人頭首在西邊知事在東序露柱燈籠如法而住畢竟與未跨門時一般耶兩般良久云衆眼難瞞上堂衲僧家不瀟灑嫌人贊愛人罵無諍三昧知音者寡三昧即且置如何是無諍客來須接賊來須打上堂諸方談禪地藏種田只見一邊趙州喫茶禾山打鼓不堪共語我者裏絶承當家醜無端向外揚法華經會上堂法華經藏深固幽遠師曠之聰不聞離婁之明不見南山粲白石爛靈山一會嚴然未散上堂舉華嚴經菩薩以菩提心為家以如理修行為家法師云家則且止如何是家法頌云浪宕樓頭無藉在零丁利帝可憐生惡叉聚是此中入佛子住非他處成上堂舉法界觀云法身流轉五道名曰衆生故令衆生現時法身不現師頌云佛真法身抵死謾生自沽村酒自把磁瓶却著衫來作主人上堂舉如有大經卷量等三千界在於一塵中一切塵亦然有一聰慧人淨眼悉能見破塵出經卷廣饒益衆生師拈云擬破一微塵分明昧此經如何破經卷出此一微塵成道上堂惡星臨照命宮時雪重山寒眼𥉌癡我似釣魚船上客還將哥邏報君知上堂日日雨夜夜雨鎖了日輪閉了月戶稻也壞麥也壞不知者箇壞不壞問取明州憨布袋上堂舉修山主曰日出心光耀天陰性地昏又曰萬法是心光諸緣惟性曉往往諸方便謂修山主説心説性北澗又作麼生顧視大衆云誰敢與他安名立字上堂行亦禪坐亦禪飢噇飯困噇眠三到投子九上洞山無端掘地覔青天寧國府彰教禪寺語録參學大觀編故舊至上堂舉博山上堂橫按主丈云不是年來頻勸酒自從別後見君難博山雖則土曠人稀相逢者少彰教門下則不然道絶人荒未得一半謙藏主開接待上堂門對廬山岸橫溢浦把定要津鴉飛不渡把飯與人喫且道是好心不是好心楊子江波未是深宗元谷及俗兄訃至上堂人從黃池來報昨日家兄死又自平江來者報今朝舍弟亡古人是趂對語彰教是實法大小彰教因甚作實法會指禪床云若教頻下淚滄海也須乾舉哀死便埋死便埋本來無位次僧趂俗安排赤洪崖白洪崖是我冤家一樣乖哀哀至節上堂舉溈山問仰山仲冬嚴寒年年事運推移事若何仰山近前叉手而立溈山云情知你答者話不得香嚴云某甲偏答得者話溈山云你作麼生香嚴叉手退後而立師拈云奮擘竹機用險崖句則不無二子若答者話方木投圓孔上堂舉玄沙問小塘長老昨日一場閙向甚麼處去小塘提起袈裟角玄沙云料掉沒交涉師拈云二大老只知今日明日不覺前秋後秋北澗則不然今日靜悄悄昨日閙啾啾風定花猶落鳥啼山更幽上堂懸崖撒手自肯承當絶後再蘇欺君不得所以道我立地待汝透去擲主丈云討什麼碗上堂郍吒太子折肉還父折骨還母正當與麼時太子在什麼處師拈云肉還父骨還母日西沈水東注良久云露常州顯慶禪寺語録參學大觀編三門從者裏入向那邊行到家消息斷日午打三更佛殿不為禮禮必壞千人來萬人拜黃面瞿曇喫者一解方丈七縱八橫千重百匝正令全提是計不納喝一喝法座此座比諸方忒小今日不免小中現大去也看看本來法爾如斯不是雲居羅漢提綱金猊鐵脊鐵腰頑逐隊隨群屈節難要打衲僧門下過避些炎熱耐些寒要見避些炎熱耐些寒底㨾子麼檔谷成陰去作金鑾上客靡不有初芋煨糞火銀鈎那識紫泥隄防不密莫把是非來辨我浮生穿鑿不相干全身坐在是非裏剛被世人知住處老僧明日又遷居靈龜曳尾古人㨾子一時花擘了也北澗樣子誰是知音一曲兩曲無人會雨過夜塘秋水深高原和尚訃至上堂二月十一人從北山來報高原死也似者般僧只患多不患少啞更覔一箇如星中月砂裏金簸土揚塵無處尋上堂據虎頭收虎尾未見其人第一句下明宗旨嘗聞其語踢起便行白雲萬里二鄉僧歸鄉上堂未發足南方已前早知錯了底十有五雙往往當面諱却不肯承當若不將錯就錯未免雪上加霜我者裏纂節去處擲主丈云聽他煙棹上瞿塘元宵上堂淨名有無盡燈法門後世機巧取次翻騰一燈十鏡十鏡一燈交光相羅徵詰無痕鏡自鏡燈自燈大家吹滅暗中行佛涅槃上堂敗闕在雙林都無迹可尋海枯終見底人死不知心明慶和尚至上堂賊來須打客來須接明慶長老來打即是接即是若打來不見贓物若接來未問蹤由休休不是冤家不聚頭正旦上堂元正啓祚萬物咸新即日伏惟無位真人飽莫喜飢莫嗔一日從頭五合陳上堂舉圓覺經居一切時不起妄念於諸妄心亦不息滅住妄想境不加了知於無了知不辨真實師頌云扁舟兩岸依林樾蕭蕭兩鬢吹華髮萬事不理醉復醒長占煙波弄明月謝新舊兩序上堂量才補職修德養間一動一靜妙轉機關輝天鑑地許誰看四月八日上堂虗空無相身墮地惹埃塵不入紅塵裏驢年洗得清常州碧雲崇明禪寺語録參學大觀編三門羅漢山當戶朝來有聖燈藩籬俱剖破不揀小乘僧佛殿見泥龕拜泥龕對塑像亦作禮佛滅二千年比丘少慚愧方丈一發中的百發破的碧雲十字路頭又添三害之一拈帖拈起示衆云者箇是縉紳老尊宿常州監察王御史萬牛挽不回底筆下一點墨散在碧雲兩處成龍別有靈犀一點通上堂日可冷月可熱衆魔不能壞真説且道如何是真説三人證龜定不是鱉上堂十方同聚會各夢同床箇箇學無為彼自無瘡此是選佛場蠱毒之鄉心空及第歸歸即不無到家一句可得聞乎卓主丈云回首依然在半途上堂舉孝宗皇帝問佛照禪師釋迦入山六年所成者何事佛照對云將謂陛下忘却師頌云借婆衫子拜婆年監本匙挑不上禪扶起玉龍轟霹𮦷明星猶在九重天上堂舉黃蘗向南泉位中坐泉云長老甚麼年行道蘗云威音王已前泉云猶是王老師兒孫在蘗遂歸第二座師拈云黃蘗下座南泉上座常州紙貴一狀領過上堂舉趙州訪投子話拈云油油同聲相應同氣相求金簇慣調曾百戰鐵鞭多力恨無讎正旦上堂露柱通宵守歲兜燈籠侵早拜年兜烏藤趂隊無記跳出禪床左畔兜普伸祝頌隨婁搜享千秋天生富貴切忌他求卓主丈云好消息兜上堂人棄我取人取我與弄業識團無本可據毀於佛謗於法不入衆數分明有眼難緇素上堂三世佛法三世不會六代佛法六代不會天下老和尚佛法天下老和尚不會慚愧目今諸山佛法無所不會無所不知也大奇路上行人口似上堂舉安禪師破句讀楞嚴經師頌云未到忘筌地携籃等跳蝦錯行樵子徑却到葛洪家上堂西天以蠟人為驗此土如何隨家豐儉畢竟以何為驗殺人刀活人劒上堂蛟不識劒劒下死虎不識穽穽中死魚以水為命因甚又向水中死因行不妨掉臂上堂魯祖見僧便面壁平生肝膽向人傾潦倒北澗無背無面終不為君通任從滄海變福聖曇師叔訃至上堂或問福聖大通禪師遷化向甚處去向他道泥豬疥狗不願生天行家滅胡種成佛待驢年上堂季冬月旦看看又是臘月三十日謂之結交頭亦謂之極則處還有人向者裏轉得身麼若有新羅喫飯少林齋脫或未然南天台北五臺上堂簷頭滴滴分明歷歷明眼衲僧卓主丈云切忌從者裏入太后升遐上堂長樂宮深漏箭遲憂家丙夜細思惟鐘鳴漏盡龍樓曉無復雞人問寢時上堂三月旦春過半胡孫繫露柱露柱聲聲喚南山粲白石爛卓主丈云只者一著何曾爛上堂舉圓覺章云此觀不得復習彼觀心不放捨漸次求證卓主丈云主丈子聞得不覺失笑即説呪曰三觀門開普請活埋我立地待汝透去豈欺我哉擲主丈下座上堂舉文殊拈玻璃盞問無著云南方還有者箇麼著云無文殊云將甚麼喫茶著無語保寧勇和尚代無著以手指口師拈云若是北澗便把茶喫上堂獨釣海山秋綸竿五十牛叮嚀螺與蚌莫傍釣鰲鈎移佛上堂東邊移了復西移不動尊還有動時弗打併他蹲坐處安知四十九年非成道上堂透骨寒凝眼不開陽和一點自何來六年辛苦都休了不悟明星是禍胎為維那侍者上堂三應三呼不辭入草罰錢出院正要話行軟頑侍者孟浪克賓數聲羌笛離亭晚君向瀟湘我向秦重午上堂諸方今日書符底書符採藥底採藥碧雲窮廝煎餓廝吵只者一著盡情拈却良久云開眼也著合眼也著上堂一人常在途中不離家舍一人離家舍不在途中且如何道得接手句自南自北自西自東平江府常熟縣惠日禪寺語録參學大觀編請書記藏主上堂薑杏杯深恨未消竹篙只作等間搖一從收卷波瀾後誰在坳堂學弄潮所以道不是弄潮人莫入洪波裏須還他神通藏子轉轆轆地始得且道左轉耶右轉喝一喝開爐上堂舉雪峯示衆云世界闊一赤古鏡闊一赤世界闊一丈古鏡闊一丈玄沙以手指火爐云未審者箇闊多少雪峯云如古鏡闊師拈云雪峯千五百人善知識以丈赤取信天下後世莫敢不信若言如古鏡闊莫敢不疑卓主丈云疑則別參定首座至上堂先佛照道棒頭撥著活衲僧正法眼藏增高價北澗則不然棒頭撥著活衲僧正法眼藏瓦解冰消且道與先佛照是同是別因事上堂獨掌不浪鳴單絲不成線此是諸方普請邊事若是惠日門下却要單絲成線獨掌自鳴夜深方見把針人上堂舉密師伯與洞山在餅店密於地上畫一圓相謂洞山云把將去山云拈將來後來保寧勇和尚云非但二人提不起盡大地人亦提不起北澗敢道保寧計窮力盡上堂舉古人道此心猶未了滴水也難消北澗則不然此心何用了滴水不難消且道與古人是親是疏卓主丈云養雞意在五更初謝新舊兩序上堂莫袖搴旗手同扶折腳鐺高碁放低著死路活教行謝定首座上堂從上超宗逸格事若非咬豬狗手腳如何正眼覷著譬如琴瑟箜篌雖有妙音若無妙指終不能發妙指既發妙音密圓萬竅無聲墻壁有耳何必清風動天地浴佛上堂一聲哇地便吒哩突出如斯大闡提此土西天起殃害堂堂洗土不成泥上堂昔有一秀才作無鬼論有一鬼出云你道無鬼我聻秀才遂閣筆北澗若見他恁麼道只向他道將謂你是箇人元來也是鬼上堂舉香嚴道去年貧未是貧倒食甘蔗今年貧始是貧漸入佳境去年貧猶有卓錐之地解使不由家富貴今年貧錐也無卓窮鬼子快活得徹困仰山喚作如來禪賊賊慧日今年尤更狼狽行人更在青山外徑山臯雪溪西堂訃至上堂雪溪一漚滅輥入龍湫裏龍湫攪得渾六月凍連底喝石巖前菖蒲田裏癡人猶戽夜塘水照藏主歸鄉上堂來恨出闕遲歸嫌入峽遲疑今真箇悟悟昔不曾疑南詢是妄北謁還非日暮碧雲合亂山啼子規上堂似恁麼熱無覔箇不熱處東西十萬南北八千到處去來不如在此且道此是何境界北澗到者裏却自不知卓主丈云當局者迷為亡僧上堂舉僧問大龍色身敗壞如何是堅固法身龍云山花開似錦澗水湛如藍色身敗壞也如何是宣首座堅固法身日輪正當午薰風來自南安吉州道場山護聖萬歲禪院語録參學大觀編佛照忌拈香拙拙拙盡巧生一場敗缺有時證鱉成龜驀地證龜成鱉諸郎盡解使爺錢磹窠不肖子拍手笑掀天笑他弄到帝王前上堂天下本無事庸人擾之耳譬如轉輪王王大千界其諸小王不肯順伏兵戰有功隨功賞賜象馬車乘金銀琉璃髻中明珠亦以與之敢問大衆獨王頂上有此一珠因甚亦以與之卓主丈云干戈中立太平基雪中上堂一法若有毗盧墮在凡夫萬法若無普賢失其境界滿眼是銀色世界處處是普賢且道普眼還見也未上堂去年梅今歲柳天地有全功物物還依舊衲子生涯也如舊頭上青灰三五斗臘雪後春風前莫教蹉過钁頭邊昭覺圭土庵碧雲空老訃至上堂一棹鬼門關橫飛關外天九華天下勝趂得雪中看碧雲暮合雲與僧間偶爾相逢到此間且道是生耶死耶衆眼難瞞上堂舉大慧在京師作書記圓悟常令在左右一日對客舉筯大慧不覺眼盵瞪圓悟云者漢參得箇黃楊木禪師拈云大小圓悟揠苗助長聖節上堂八表歸仁一人有慶樵唱漁歌拍拍是令畢竟是何曲調以手拍禪床云萬年歡上堂今朝三月初五天色半晴半雨園林過了清明無限落花飛絮釋迦慳彌勒富絶憐杜宇不知時啼得血流無用處上堂九十日春至今朝五更初都無纖毫見管了也且道據什麼道理便恁麼去卓主丈云主丈子道兩箇泥牛鬪入海直至如今無消息諦當甚諦當敢保未徹在花木瓜甚奇怪解道雞嶼洋無蓋靠主丈下座保寧慧老至上堂舉勇和尚與白雲師兄相別偈云提起葛藤拽不斷老胡烏足論長短五須彌山高不高四大海水滿不滿看來也好葛藤今日從葛藤窠裏來又却墮在金峯窠裏何故雲月是同溪山各異上堂舉僧問大慧不與萬法為侶者是什麼人大慧云是箇天上天下沒奈何底人僧云如何却在徑山座下答云家無小使不成君子不肖孫則不然或有問不與萬法為侶者是什麼人只向他道匙挑不上如何却在虎巖會下石橋北南院西揀盡寒枝不肯棲出隊歸上堂半月出去鼻孔不見眼睛一日歸來眼睛不見鼻孔失却惺惺換得骨董雖然只是潑骨董貪者不與廉者不取卓主丈云打歸常住結制上堂九旬禁足是何三昧合火成群東倒西攂忽若箭鋒相拄時突出眼睛揭却腦蓋虎巖向他道未在上堂舉布袋和尚在通衢立有僧云作什麼布袋云等箇人休使奉化僧云來也破衫袖布袋取一橘子與僧賊贓不受僧才接布袋縮手云你不是者箇人又使奉化也者僧不合放過他待他道等箇人只向道謝三娘稱銀臨安府淨慈山報恩光孝禪寺語録參學大觀編佛殿此膝不屈於人久矣今日因甚作者模樣覿面相呈當仁不讓方丈升九仞之上吾必與之俱極九淵之底吾亦與之俱吾不見時何不見吾喝一喝祝香此一瓣香恭為今上皇帝祝延聖壽無疆萬歲萬歲萬萬歲次拈香云此一瓣香奉為大丞相國公洎文武百僚同資祿算又拈香云此一瓣香奉為三奉詔旨五宿觀堂走殺天下衲僧前住徑山投老鄮峰東庵先師和尚無恩可報無耻可雪將此身心奉塵剎升座法不孤起伏境方生法隨法行法幢隨處建立所以永嘉道建法幢立宗旨明明佛勑曹溪是豈獨曹溪三千大千世界無有如芥子許不是菩薩降生出家修道轉法輪般涅槃處只今欲建楊歧白雲宗旨堅最勝幢直得鴉飛不度與湖海毀佛謗法不入衆數大闡提人同一手作發吾花木瓜樹下垃圾堆頭明月夜光照天照地去也忽有箇忍俊不禁出來道美則美矣爭奈千兵易得一將難求只向他道心不負人面無慚色復舉三聖興化公案師拈云二大老出便出斷價作什麼北澗今日出且道為人不為人卓主丈下座當晚小參舉法雲佛照杲和尚云老僧熙寧八年丈帳在鳳翔府供申是年華山崩倒壓了八十餘里人家你輩後生知甚茄子瓠子佛照每上堂長舉此話以示學者師云談玄説妙落在今時瓠子落蘇那得知上堂諸佛不出世四十九年説説箇什麼祖師不西來少林有妙訣也好藏拙是假易除是真難滅上堂塵劫前事盡在今時當斷不斷千駟莫追卓主丈云花須連夜發莫待曉風吹上堂智不到處切忌道著道著則頭角生古人恁麼告報淨慈則不然智不到處滿口道著與你大書特書屢書於虗空中不怕風吹日炙卓主丈云有名不用鐫頑石祈雨上堂大機莫酬小枝速化驀拈主丈云扶過斷橋水伴歸明月村未稱全提若濟巨川用汝作舟楫若歲大旱用汝作霖雨卓主丈云甜瓜徹蒂甜苦瓠連根苦上堂久坐大雄峯寒灰撥不紅一星螢火出孤鶴已遼東成道上堂誤將螢火作明星發得些兒鬼眼睛末代只看王勃記何殊瘞鶴紫陽銘上堂舉百丈震問法