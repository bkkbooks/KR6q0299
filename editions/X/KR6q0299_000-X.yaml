body:
  text: 北磵老師人品甚高造道甚深其為文章奇偉峭甚似柳柳州夫不逸於佛固當在儒林丈人行至若沈冥得喪之表超脫死生之際則文字語言又特其遊戲三昧彼以文訾之者固陋以禪譽之者亦淺焉耳非文非禪妙不可傳而可觀乃方掇拾糟粕以為鉅編得不貽定中一囅然乎雖然道不可以言傳而非言亦無以求道是編之出於無學者盖不為無助也余昔假守苕霅甞以師表聞于朝主道場法席天子知其名詔遷淨慈卒老於斯焉其兄壞菴居照亦西州大尊宿與老大父清惠公為方外交云淳祐十二年春二月既望東北人劉震孫題一脉能分妙喜泉薰風一轉代流傳等閒坐斷南山頂擊碎珊瑚也直錢北磵禪師以載道之文嗚于時方壯歲已為善知識名公卿友而畏之或者捨其造詣而聲其文豈深知吾北磵也耶物初携室中語來因題其後秋房樓治拙菴以拙為人人所共用唯北磵向巧拙不及處指柳罵桑喚龜作鱉所謂正宗別調直指曲說者是此老人所供當有與之翻欵者淳祐戊申三月既望法姪孫靈隱心月敬書北磵和尚自是甘露滅舟峰菴秀紫芝之流亞見佛照師祖後巧盡拙出如虎插翅乖乖厓厓人知其一未知其二九會葛藤自揚醜惡從苗辨地余言豈誣眼裏無筋此老受屈淳祐辛亥解制前三日住冷泉大川普濟北磵和尚語錄目次台州般若院台州報恩孝寺湖州鐵觀音寺湖州西余大覺寺安吉州圓覺寺寧國彰教寺常州顯慶寺常州碧雲崇明寺平江府常熟縣慧日寺道場山護聖萬歲院淨慈山報恩光孝寺小參秉拂告香普說法語頌古偈頌贊小佛事
